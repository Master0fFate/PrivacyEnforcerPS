name: Build and test privacy safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore PrivacyEnforcerPro.sln
      - run: dotnet build PrivacyEnforcerPro.sln --configuration Release --no-restore
      - run: dotnet test PrivacyEnforcerPro.sln --configuration Release --no-build --logger trx
      - name: Exercise read-only catalog
        run: dotnet run --project PrivacyEnforcerPro/PrivacyEnforcerPro.UI --configuration Release --no-build -- list --json
