[workspace]
resolver = "2"
members = [
    "crates/pef-core",
    "crates/pef-platform",
    "crates/pef-cli",
    "crates/pef-gui",
]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Master0fFate/PrivacyEnforcerPS"
authors = ["Master0fFate"]

[workspace.dependencies]
pef-core = { path = "crates/pef-core" }
pef-platform = { path = "crates/pef-platform" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
unicode-segmentation = "1.12"
tempfile = "3"
# GPUI Fast: longbridge's performance fork of Zed's GPUI, aliased to GPUI's crate names.
gpui = { package = "gpui-fast", version = "0.1.10" }
gpui_platform = { package = "gpui-fast-platform", version = "0.1.10" }
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
